  {id:"wing",max:5,col:"#52f19a",n:["Wing Cannons","Pháo cánh"],d:lv=>L(`${lv*2} angled side shots per volley`,`${lv*2} viên đạn chéo mỗi loạt`)},
  {id:"drone",max:3,col:"#9fdcff",n:["Escort Drones","Drone hộ tống"],d:lv=>L(`+${lv} extra drone pair${lv>1?"s":""}`,`+${lv} cặp drone phụ`)},
  {id:"nova",max:5,col:"#ffd970",n:["Nova Pulse","Sóng nova"],d:lv=>L(`Shockwave every ${novaCd(lv).toFixed(1)}s hits nearby enemies and erases bullets`,`Mỗi ${novaCd(lv).toFixed(1)}s phát sóng xung kích quanh tàu, xoá đạn địch`)},
  {id:"regen",max:3,col:"#52f19a",n:["Nano Repair","Sửa chữa nano"],d:lv=>L(`Repair 1 HP every ${[0,14,10,7][lv]}s`,`Hồi 1 máu mỗi ${[0,14,10,7][lv]}s`)},
  {id:"maxhp",max:3,col:"#ff4fa3",n:["Reinforced Hull","Gia cố thân tàu"],d:lv=>L(`+${lv} max HP and repair 1 HP now`,`+${lv} máu tối đa, hồi 1 máu ngay`)},
  {id:"magnet",max:3,col:"#b36bff",n:["Tractor Field","Trường hút"],d:lv=>L(`+${lv*60}px pickup range`,`+${lv*60}px tầm hút vật phẩm`)}];
const misCd=lv=>Math.max(.9,2.6-.35*lv),zapCd=lv=>Math.max(1.2,3.2-.4*lv),novaCd=lv=>Math.max(3,7.5-.9*lv);
const MAX_SLOTS=6;
const rs=id=>(B&&B.rs[id])||0;
const xpNeed=lv=>Math.round(5*Math.pow(1.24,lv-1));
const skName=sk=>L(sk.n[0],sk.n[1]);
const skIcon=(sk,cls="")=>vIcon("sk_"+sk.id,cls);
const runDmg=()=>shipPow(S.ship)/100*(1+.2*rs("damage"))*(1+gb().dmg)*(1+pk().dmg);

function gainXp(v){if(B.over)return;v*=1+gb().xp+pk().xp;B.xp+=v;while(B.xp>=xpNeed(B.lv)){B.xp-=xpNeed(B.lv);B.lv++;if(!B.ending)B.pendingLv++;}
  if(B.pendingLv>0&&!B.picking&&!B.ending)setTimeout(()=>{if(B&&!B.over&&!B.picking&&B.pendingLv>0)levelUp();},120);updHud();}
function rollCards(){const owned=Object.keys(B.rs).length;
  let pool=RUNSK.filter(s=>rs(s.id)<s.max&&(rs(s.id)>0||owned<MAX_SLOTS));
  const out=[];while(out.length<3&&pool.length){let tot=pool.reduce((a,s)=>a+(rs(s.id)?1.4:1),0),r=Math.random()*tot,k=0;
    for(;k<pool.length;k++){r-=rs(pool[k].id)?1.4:1;if(r<=0)break;}k=Math.min(k,pool.length-1);out.push(pool[k]);pool.splice(k,1);}
  if(!out.length)out.push({id:"_repair",col:"#52f19a",n:["Field Repair","Sửa nhanh"],d:()=>L("Repair 2 HP","Hồi 2 máu"),max:99},{id:"_bounty",col:"#ffc83d",n:["Bounty","Tiền thưởng"],d:()=>L("+150 coins","+150 xu"),max:99});
  return out;}
function levelUp(){B.picking=true;B.paused=true;drag=null;sfx("up");vib(40);const cards=rollCards(),el=$("#lvup");
  el.innerHTML=`<div class="lvhead"><div class="disp lvt">${L("LEVEL UP!","LÊN CẤP!")}</div><div class="lvsub">${L("Pilot level","Cấp phi công")} ${B.lv} · ${L("choose one skill","chọn 1 kỹ năng")}</div></div>
   <div class="lvcards">${cards.map((sk,i)=>{const cur=rs(sk.id),nx=cur+1,isNew=!cur&&sk.id[0]!=="_";return `<button class="lvcard" data-c="${i}" style="--sc:${sk.col}">
     <div class="lvic">${sk.id[0]==="_"?`<b class="skfb" style="color:${sk.col}">+</b>`:skIcon(sk)}</div>
     <div class="lvtx"><div class="row" style="gap:6px"><b class="lvname">${skName(sk)}</b>${isNew?`<span class="lvnew">${L("NEW","MỚI")}</span>`:""}</div>
      <div class="lvdesc">${sk.d(nx)}</div>
      ${sk.id[0]==="_"?"":`<div class="lvpips">${Array.from({length:sk.max},(_,k)=>`<i class="${k<cur?"on":k===cur?"nx":""}"></i>`).join("")}<span>Lv ${nx}/${sk.max}</span></div>`}</div></button>`;}).join("")}</div>
   <div class="lvfoot"><button class="btn ghost sm" id="lvRe">${L("Reroll","Đổi thẻ")} · ${B.rerolls>0?L("free","miễn phí")+" ("+B.rerolls+")":priceTxt({gem:10})}</button></div>`;
  el.hidden=false;
  el.querySelectorAll(".lvcard").forEach(b=>b.onclick=()=>pickCard(cards[+b.dataset.c]));
  $("#lvRe").onclick=()=>{if(B.rerolls>0)B.rerolls--;else if(!spend({gem:10}))return;levelUp();};}
function pickCard(sk){const p=B.p;
  if(sk.id==="_repair")p.hp=Math.min(p.maxHp,p.hp+2);
  else if(sk.id==="_bounty")B.coins+=150;
  else{B.rs[sk.id]=rs(sk.id)+1;const lv=B.rs[sk.id];
    if(sk.id==="multishot")p.wlv=1+lv;
    if(sk.id==="maxhp"){p.maxHp++;p.hp=Math.min(p.maxHp,p.hp+1);}
    floatTxt(p.x,p.y-40,skName(sk)+" "+lv,sk.col);}
  sfx("coin");B.pendingLv--;$("#lvup").hidden=true;B.picking=false;
  if(B.pendingLv>0){levelUp();return;}
  B.paused=false;p.inv=Math.max(p.inv,.8);last=performance.now();updHud();}
function skillBarHtml(big){const ids=Object.keys(B.rs);if(!ids.length)return big?"":`<span class="sbempty">${L("Collect crystals to level up","Nhặt tinh thể để lên cấp")}</span>`;
  return ids.map(id=>{const sk=RUNSK.find(s=>s.id===id);return `<span class="sbi" title="${skName(sk)}">${skIcon(sk)}<em>${B.rs[id]}</em></span>`;}).join("");}

/* per-frame effects of the add-on skills */
function runSkillsUpdate(dt){const p=B.p;if(!p.alive||B.over)return;const T=B.rt,pw=runDmg();
  const targets=()=>B.en.filter(e=>!e.dead&&e.age>0&&e.y>0&&e.y<H);
  if(rs("missile")){T.mis=(T.mis||0)-dt;if(T.mis<=0){T.mis=misCd(rs("missile"));for(let i=0;i<rs("missile");i++){const s=i%2?1:-1;B.pb.push({x:p.x+s*14,y:p.y,vx:s*(120+i*30),vy:-260,dmg:2.2*pw,r:4,homing:1,rocket:1,kind:"rs"});}}}
  if(rs("lightning")){T.zap=(T.zap||0)-dt;if(T.zap<=0){T.zap=zapCd(rs("lightning"));let from={x:p.x,y:p.y},pts=[[p.x,p.y-20]],pool=targets(),n=rs("lightning")+1;
      if(B.boss&&B.boss.y>40){pts.push([B.boss.x,B.boss.y]);hitBoss(3*pw);n--;from=B.boss;}
      while(n-->0&&pool.length){pool.sort((a,b)=>Math.hypot(a.x-from.x,a.y-from.y)-Math.hypot(b.x-from.x,b.y-from.y));const e=pool.shift();if(Math.hypot(e.x-from.x,e.y-from.y)>320)break;pts.push([e.x,e.y]);hitEnemy(e,3*pw);from=e;}
      if(pts.length>1){B.fx.push({bolt:boltPath(pts),nodes:pts.slice(1),life:.28,max:.28});sfx("hit");}}}
  if(rs("nova")){T.nova=(T.nova||0)-dt;if(T.nova<=0){T.nova=novaCd(rs("nova"));const R=120+15*rs("nova");
      B.fx.push({nova:1,x:p.x,y:p.y,R,life:.5,max:.5,col:"255,200,61"});B.eb=B.eb.filter(b=>Math.hypot(b.x-p.x,b.y-p.y)>R);
      for(const e of targets())if(Math.hypot(e.x-p.x,e.y-p.y)<R)hitEnemy(e,4*pw);if(B.boss&&Math.hypot(B.boss.x-p.x,B.boss.y-p.y)<R+B.boss.r)hitBoss(4*pw);}}
  if(rs("regen")){T.reg=(T.reg||0)+dt;if(T.reg>=[0,14,10,7][rs("regen")]){T.reg=0;if(p.hp<p.maxHp){p.hp++;floatTxt(p.x,p.y-30,"+1 HP","#52f19a");updHud();}}}
  const no=rs("orbit");if(no){const R=58+no*3;for(let i=0;i<no;i++){const a=B.t*3.2+i/no*Math.PI*2,ox=p.x+Math.cos(a)*R,oy=p.y+Math.sin(a)*R;
      for(const e of B.en){if(e.dead||e.age<0)continue;if((e.oc||0)>B.t)continue;if(Math.hypot(e.x-ox,e.y-oy)<e.r+9){e.oc=B.t+.25;hitEnemy(e,1.2*pw);}}
      const b=B.boss;if(b&&b.y>40&&(b.oc||0)<B.t&&Math.abs(b.x-ox)<b.r&&Math.abs(b.y-oy)<b.r*.7){b.oc=B.t+.25;hitBoss(1.2*pw);}
      B.eb=B.eb.filter(q=>Math.hypot(q.x-ox,q.y-oy)>q.r+8);}}}
function renderRunSkills(c){const p=B.p;if(!p.alive)return;
  const no=rs("orbit");if(no)drawOrbs(c,p,no);
  const nd=rs("drone");if(nd){const dd=droneDef("sparrow");for(let k=1;k<=nd;k++)[-1,1].forEach(s=>drawDrone(c,dd,p.x+s*(38+k*24),p.y+18+k*6,9,B.t+k));}}

/* --- signature skills (ultimates) --- */
function useUlt(){if(!B||B.paused||B.over)return;if(B.ult<100)return toast(L("Destroy enemies to charge your signature skill","Hạ địch để nạp tuyệt chiêu"));
  const p=B.p,id=S.ship,pw=runDmg(),u=ULTS[id];B.ult=0;sfx("up");vib(60);banner(u.name.toUpperCase(),"");B.shake=8;
  if(id==="kestrel")B.od=6;
  else if(id==="viper")B.laser=3.5;
  else if(id==="raptor")B.swarm=24;
  else if(id==="halo"){const ring=k=>{if(!B)return;for(let i=0;i<16;i++){const a=i/16*Math.PI*2;B.pb.push({x:B.p.x+Math.cos(a)*36,y:B.p.y+Math.sin(a)*36,vx:Math.cos(a)*320,vy:Math.sin(a)*320,r:6,homing:1,dmg:3*pw,kind:"halo"});}};ring();setTimeout(ring,450);}
  else if(id==="tempest")B.storm=12;
  else if(id==="nebula")B.hole={x:W/2,y:H*.32,t:4};
  else if(id==="seraph"){B.fx.push({nova:1,x:p.x,y:p.y,R:Math.max(W,H)*1.1,life:.8,max:.8,col:"255,200,61"});B.eb=[];B.en.forEach(e=>{if(e.age>0)hitEnemy(e,30*pw)});if(B.boss)hitBoss(45*pw);}
  else if(id==="oblivion"){B.freeze=4;}
  updHud();}
function ultUpdate(dt){const p=B.p,pw=runDmg();
  if(!B.over)B.ult=Math.min(100,B.ult+dt*1.2*(1+pk().ultRate));
  if(pk().regen&&p.alive&&!B.over){B.npT+=dt;if(B.npT>=pk().regen){B.npT=0;if(p.hp<p.maxHp){p.hp++;floatTxt(p.x,p.y-30,"+1 HP","#52f19a");updHud();}}}
  const ub=$("#skUlt"),sh=Math.floor(B.ult);if(sh!==B.ultShown){B.ultShown=sh;ub.style.setProperty("--p",sh+"%");ub.classList.toggle("ready",sh>=100);}
  if(B.od>0)B.od-=dt;
  if(B.freeze>0)B.freeze-=dt;
  if(B.laser>0){B.laser-=dt;const hw=30;for(const e of B.en)if(!e.dead&&e.age>0&&e.y<p.y&&Math.abs(e.x-p.x)<hw+e.r)hitEnemy(e,14*pw*dt);
    const b=B.boss;if(b&&b.y>40&&Math.abs(b.x-p.x)<hw+b.r)hitBoss(14*pw*dt);B.eb=B.eb.filter(q=>!(q.y<p.y&&Math.abs(q.x-p.x)<hw));}
  if(B.swarm>0){B.swt=(B.swt||0)-dt;if(B.swt<=0){B.swt=.05;B.swarm--;const s=B.swarm%2?1:-1;B.pb.push({x:p.x+s*16,y:p.y,vx:s*rnd(80,220),vy:-rnd(200,320),dmg:2.6*pw,r:4,homing:1,rocket:1,kind:"rs"});}}
  if(B.storm>0){B.stt=(B.stt||0)-dt;if(B.stt<=0){B.stt=.18;B.storm--;const pool=B.en.filter(e=>!e.dead&&e.age>0&&e.y>0&&e.y<H);let tx,ty;
      if(pool.length){const e=pool[Math.floor(Math.random()*pool.length)];tx=e.x;ty=e.y;hitEnemy(e,12*pw);}else if(B.boss&&B.boss.y>40){tx=B.boss.x+rnd(-30,30);ty=B.boss.y;hitBoss(12*pw);}else{tx=rnd(40,W-40);ty=rnd(80,H*.5);}
      B.fx.push({bolt:boltPath([[tx+rnd(-40,40),-10],[tx,ty]]),nodes:[[tx,ty]],life:.3,max:.3});B.shake=Math.max(B.shake,4);sfx("hit");}}
  const h=B.hole;if(h){h.t-=dt;if(h.t<=0)B.hole=null;else{const R=150;for(const e of B.en)if(!e.dead&&e.age>0&&Math.hypot(e.x-h.x,e.y-h.y)<R)hitEnemy(e,7*pw*dt);
    const b=B.boss;if(b&&Math.hypot(b.x-h.x,b.y-h.y)<R+b.r)hitBoss(7*pw*dt);
    for(const q of B.eb){const dx=h.x-q.x,dy=h.y-q.y,d=Math.hypot(dx,dy);if(d<190){q.vx+=dx/d*600*dt;q.vy+=dy/d*600*dt;if(d<22)q.dead=true;}}}}}
function renderUlt(c){const p=B.p;
  if(B.laser>0&&p.alive){const al=Math.min(1,B.laser*2),fl=.85+.15*Math.sin(B.t*40);c.save();c.globalCompositeOperation="lighter";
    for(const [w,col] of [[70,`rgba(82,241,154,${.18*al})`],[40,`rgba(82,241,154,${.45*al*fl})`],[14,`rgba(230,255,240,${.95*al})`]]){c.fillStyle=col;c.fillRect(p.x-w/2,0,w,p.y-24);}
    const g=c.createRadialGradient(p.x,p.y-26,2,p.x,p.y-26,40);g.addColorStop(0,"#ffffff");g.addColorStop(1,"#52f19a00");c.fillStyle=g;c.beginPath();c.arc(p.x,p.y-26,40,0,7);c.fill();c.restore();}
  const h=B.hole;if(h){const al=Math.min(1,h.t*2,(4-h.t)*3+.2);c.save();c.translate(h.x,h.y);c.globalAlpha=al;
    const g=c.createRadialGradient(0,0,4,0,0,150);g.addColorStop(0,"#000000");g.addColorStop(.18,"#05010d");g.addColorStop(.3,"#ff4fa3aa");g.addColorStop(.55,"#9b6bff44");g.addColorStop(1,"#9b6bff00");
    c.fillStyle=g;c.beginPath();c.arc(0,0,150,0,7);c.fill();c.globalCompositeOperation="lighter";c.lineCap="round";
    for(let k=0;k<4;k++){c.strokeStyle=k%2?"rgba(255,79,163,.55)":"rgba(179,107,255,.55)";c.lineWidth=4;c.beginPath();
      for(let s=0;s<=40;s++){const r=24+s*3.2,a=B.t*-3+k*Math.PI/2+s*.16;s?c.lineTo(Math.cos(a)*r,Math.sin(a)*r):c.moveTo(Math.cos(a)*r,Math.sin(a)*r);}c.stroke();}
    c.restore();}
  if(B.od>0&&p.alive){c.save();c.globalCompositeOperation="lighter";c.strokeStyle=`rgba(56,225,255,${.4+.3*Math.sin(B.t*20)})`;c.lineWidth=3;c.beginPath();c.ellipse(p.x,p.y+8,30,40,0,0,7);c.stroke();c.restore();}}

/* --- mini-bosses (elites): live in B.en with e.mini set, so player bullets, bombs and ults hit them for free --- */
const MINIS={carrier:{name:"CARRIER",img:"miniboss_carrier",col:"#38e1ff",hp:1.1,r:36},sniper:{name:"SNIPER",img:"miniboss_sniper",col:"#ff5164",hp:.8,r:28},
  minelayer:{name:"MINE LAYER",img:"miniboss_minelayer",col:"#ff9d1c",hp:1,r:34},shield:{name:"SHIELD BEARER",img:"miniboss_shield",col:"#38e1ff",hp:.9,r:32},
  turret:{name:"TWIN TURRETS",img:"miniboss_turret",col:"#ff4fa3",hp:.42,r:28},splitter:{name:"SPLITTER",img:"miniboss_splitter",col:"#52f19a",hp:.6,r:34},
  wraith:{name:"PHASE WRAITH",img:"miniboss_wraith",col:"#b36bff",hp:.65,r:30},charger:{name:"CHARGER",img:"miniboss_charger",col:"#ffc83d",hp:1,r:32}};
const MINI_ROUTE=[["carrier","sniper"],["minelayer","shield"],["turret","splitter"],["wraith","charger"]];
function spawnMini(kind){const d=MINIS[kind],base=95*B.mul;
  const mk=o=>{const hp=base*d.hp;const e=Object.assign({type:"elite",mini:kind,hp,max:hp,r:d.r,sc:1500,c:30,flash:0,age:1,fire:99,f:-1,x:W/2,y:-70,t:0,st:0,esc:25,gen:0},o);B.en.push(e);return e;};
  if(kind==="turret"){const a=mk({x:-40,y:H*.27,tx:46,side:-1}),b=mk({x:W+40,y:H*.27,tx:W-46,side:1});a.twin=b;b.twin=a;}else mk({});
  banner("ELITE INBOUND",d.name,true);sfx("hit");}
function miniDmg(e,dmg){if(e.mini==="shield"){if(!e.vent){e.rip=.15;dmg*=.25;}else dmg*=1.5;}if(e.mini==="carrier"&&e.open)dmg*=2;
  e.dnAcc=(e.dnAcc||0)+dmg;if(B._crit)e.dnCrit=1;return dmg;}
function aimAt(e,n,spread,v,extra={}){const a0=Math.atan2(B.p.y-e.y,B.p.x-e.x);for(let i=0;i<n;i++){const a=a0+(i-(n-1)/2)*spread;B.eb.push(Object.assign({x:e.x,y:e.y+e.r*.5,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:5},extra));}}
function miniUpdate(e,dt){const p=B.p;e.t+=dt;e.st+=dt;e.fire=99;dnFlush(e,dt);if(e.rip>0)e.rip-=dt;
  
  if(e.leaving){e.y-=280*dt;if(e.y<-100){e.dead=true;e.escaped=1;}return;}
  const enter=ty=>{if(e.y<ty-1){e.y+=Math.min(170*dt,ty-e.y);return true;}return false;};
  const v=165+25*Math.min(2,B.mul-1);
  switch(e.mini){
  case "carrier":{if(enter(H*.27))return;e.x+=(W/2+Math.sin(e.t*.55)*(W/2-64)-e.x)*Math.min(1,dt*2);const c=e.st%4;e.open=c>2.4;
    if(!e.open)e.ln=0;else if(e.ln<3&&c>2.6+e.ln*.4){e.ln++;B.en.push({type:"dart",hp:EN.dart.hp*B.mul,max:EN.dart.hp*B.mul,r:EN.dart.r,sc:EN.dart.sc,c:EN.dart.c,flash:0,age:.01,fire:rnd(1,2.5),f:9,i:rnd(0,6),n:1,bx:e.x+rnd(-16,16),by:e.y+18,x:e.x,y:e.y+18});}
    break;}
  case "sniper":{if(enter(H*.27))return;e.x+=(W/2+Math.sin(e.t*.4)*(W/2-50)-e.x)*Math.min(1,dt*2);const c=e.st%3;
    if(c<1.2){e.aim=1;e.lock=0;e.ax=p.x;e.ay=p.y;}else if(c<1.55){e.aim=1;e.lock=1;}
    else if(e.aim){e.aim=0;const a=Math.atan2(e.ay-e.y,e.ax-e.x);B.eb.push({x:e.x,y:e.y+e.r*.6,vx:Math.cos(a)*900,vy:Math.sin(a)*900,r:6,t:"rail"});B.fx.push({x:e.x,y:e.y+e.r*.6,vx:0,vy:0,life:.15,max:.15,col:"#ffffff",r:12});sfx("hit");}
    break;}
  case "minelayer":{if(enter(H*.27))return;e.x=W/2+Math.sin(e.t*.7)*(W/2-56);if(e.st>1.1){e.st=0;B.eb.push({x:e.x,y:e.y+e.r*.5,vx:rnd(-20,20),vy:70,r:8,t:"mine",fuse:2.4,fuse0:2.4,ring:B.mul>1.5?12:10});}
    break;}
  case "shield":{if(enter(H*.28))return;e.x+=(p.x-e.x)*Math.min(1,dt*.7);const c=e.t%6;e.vent=c>4;
    if(!e.vent&&e.st>1.6){e.st=0;aimAt(e,5,.16,v*1.1);}break;}
  case "turret":{e.x+=(e.tx-e.x)*Math.min(1,dt*2);e.y=H*.27+(1-Math.cos(e.t*.55))/2*H*.33;const tw=e.twin&&!e.twin.dead;
    if(e.side<0&&tw){const c=e.t%2.6;e.fence=c<1?"off":c<1.4?"warn":"on";if(e.fence==="on"&&p.alive&&Math.abs(p.y-e.y)<9&&p.x>e.x&&p.x<e.twin.x)hurtPlayer();}else e.fence="off";
    if(e.st>(tw?2:1.1)){e.st=0;aimAt(e,tw?1:3,.2,v);}break;}
  case "splitter":{if(enter(H*.27))return;const ph=(e.ph=e.ph??rnd(0,6));e.x+=(W/2+Math.sin(e.t*.7+ph)*(W/2-50)-e.x)*Math.min(1,dt*1.5);
    if(e.st>(2.6+e.gen*.4)){e.st=0;if(e.gen<2)for(let i=0;i<(e.gen?1:2);i++){const s=i?1:-1;B.eb.push({x:e.x+s*e.r*.5,y:e.y+e.r*.4,vx:s*50,vy:90,r:7,t:"home",sp:120+B.mul*10,turn:1.5,age:0});}else aimAt(e,1,0,v);}
    break;}
  case "wraith":{if(!e.inn){if(enter(H*.27))return;e.inn=1;e.st=0;}const c=e.st%3.4;
    if(c<2){e.alpha=Math.min(1,c/.25);e.ghost=0;e.mark=0;if(!e.fired&&c>.15){e.fired=1;const n=B.mul>1.5?11:9,a0=Math.atan2(p.y-e.y,p.x-e.x);for(let i=0;i<n;i++){const a=a0+(i-(n-1)/2)*.14;B.eb.push({x:e.x,y:e.y+e.r*.4,vx:Math.cos(a)*v*2.3,vy:Math.sin(a)*v*2.3,r:5,t:"brake",brk:.3+Math.abs(i-(n-1)/2)*.03,slow:.22});}}}
    else if(c<2.4){e.alpha=1-(c-2)/.4;e.ghost=c>2.2;e.picked=0;}
    else{e.alpha=0;e.ghost=1;e.fired=0;if(!e.picked){e.picked=1;e.nx=rnd(60,W-60);e.ny=rnd(H*.27,H*.4);}e.mark=c>2.8;if(c>3.35){e.x=e.nx;e.y=e.ny;}}
    break;}
  case "charger":{if(!e.mode){if(enter(H*.27))return;e.mode="hover";e.st=0;}
    if(e.mode==="hover"){e.x+=(p.x-e.x)*Math.min(1,dt*1.6);if(e.st>1.4){e.mode="warn";e.st=0;}}
    else if(e.mode==="warn"){if(e.st>.8){e.mode="dash";e.st=0;sfx("hit");B.shake=Math.max(B.shake,5);}}
    else if(e.mode==="dash"){e.y+=950*dt;if(e.y>H+70){e.y=-70;e.mode="ret";}}
    else if(!enter(H*.27)){e.mode="hover";e.st=0;}
    break;}}}
function miniDeath(e){const d=MINIS[e.mini];
  if(e.mini==="splitter"&&e.gen<2){for(const s of [-1,1]){const hp=e.max*.35;B.en.push(Object.assign({},e,{hp,max:hp,r:e.r*.72,x:e.x+s*e.r*.6,dead:false,flash:0,gen:e.gen+1,st:rnd(0,1),ph:rnd(0,6),dnAcc:0,esc:Math.max(10,e.esc)}));}blast(e.x,e.y,d.col,.9);return;}
  if((e.mini==="turret"&&e.twin&&!e.twin.dead)||(e.mini==="splitter"&&B.en.some(o=>o!==e&&!o.dead&&o.mini==="splitter"))){blast(e.x,e.y,d.col,.9);B.score+=Math.round(300*B.mul);return;}
  deathSequence(e.x,e.y,d.col,.75);B.hs=.05;
  for(let i=0;i<10;i++)B.drops.push({x:e.x+rnd(-40,40),y:e.y+rnd(-30,30),vy:rnd(40,110),kind:"coin",v:20});
  for(let i=0;i<6;i++)B.drops.push({x:e.x+rnd(-36,36),y:e.y+rnd(-24,24),vy:rnd(40,90),kind:"xp",v:4});
  B.ult=Math.min(100,B.ult+15);B.score+=Math.round(1500*B.mul);banner("ELITE DOWN","");
  if(Math.random()<.25+pk().drop){const it=randGear(B.cfg.diff==="hell"&&Math.random()<.3?2:Math.random()<.35?1:0);floatTxt(e.x,e.y-24,L("NEW GEAR","TRANG BỊ MỚI"),GRCOL[it.rar]);save();}}
function drawMiniFx(c){for(const e of B.en){if(!e.mini||e.dead)continue;const d=MINIS[e.mini];
  if(e.mini==="sniper"&&e.aim){const a=Math.atan2(e.ay-e.y,e.ax-e.x),L2=Math.hypot(W,H),x0=e.x,y0=e.y+e.r*.6;c.save();c.globalCompositeOperation="lighter";
    c.strokeStyle=e.lock?`rgba(255,255,255,${.6+.4*Math.sin(B.t*40)})`:"rgba(255,81,100,.45)";c.lineWidth=e.lock?3:1.5;c.setLineDash(e.lock?[]:[8,6]);c.beginPath();c.moveTo(x0,y0);c.lineTo(x0+Math.cos(a)*L2,y0+Math.sin(a)*L2);c.stroke();c.setLineDash([]);
    c.strokeStyle="rgba(255,81,100,.8)";c.lineWidth=2;c.beginPath();c.arc(e.ax,e.ay,14,0,7);c.moveTo(e.ax-20,e.ay);c.lineTo(e.ax+20,e.ay);c.moveTo(e.ax,e.ay-20);c.lineTo(e.ax,e.ay+20);c.stroke();c.restore();}
  if(e.mini==="charger"&&(e.mode==="warn"||e.mode==="dash")){const w=e.r*2.1,al=e.mode==="warn"?.18+.14*Math.sin(B.t*25):.12;c.save();c.fillStyle=`rgba(255,81,100,${al})`;c.fillRect(e.x-w/2,e.y,w,H-e.y);
    c.strokeStyle=`rgba(255,81,100,${al*3})`;c.lineWidth=2;c.strokeRect(e.x-w/2,e.y,w,H-e.y);
    if(e.mode==="warn"){c.fillStyle=`rgba(255,200,200,${al*3})`;for(let y=e.y+40+(B.t*120)%40;y<H;y+=40){c.beginPath();c.moveTo(e.x-12,y);c.lineTo(e.x,y+12);c.lineTo(e.x+12,y);c.lineTo(e.x+12,y+6);c.lineTo(e.x,y+18);c.lineTo(e.x-12,y+6);c.closePath();c.fill();}}c.restore();}
  if(e.mini==="turret"&&e.side<0&&e.twin&&!e.twin.dead&&e.fence!=="off"){const x1=e.x+e.r*.5,x2=e.twin.x-e.r*.5,y=e.y;c.save();c.globalCompositeOperation="lighter";
    if(e.fence==="warn"){c.strokeStyle=`rgba(255,79,163,${.3+.3*Math.sin(B.t*40)})`;c.lineWidth=2;c.setLineDash([6,8]);c.beginPath();c.moveTo(x1,y);c.lineTo(x2,y);c.stroke();c.setLineDash([]);}
    else for(const [lw,col] of [[18,"rgba(255,79,163,.25)"],[8,"rgba(255,79,163,.7)"],[3,"#ffffff"]]){c.strokeStyle=col;c.lineWidth=lw+Math.random()*2;c.beginPath();c.moveTo(x1,y);c.lineTo(x2,y);c.stroke();}c.restore();}
  if(e.mini==="wraith"&&e.mark){c.save();c.strokeStyle=`rgba(179,107,255,${.5+.4*Math.sin(B.t*20)})`;c.lineWidth=3;c.beginPath();c.arc(e.nx,e.ny,e.r*(1.4-(e.st%3.4-2.8)),0,7);c.stroke();c.restore();}}}
function drawMini(c,e){const d=MINIS[e.mini],im=spr(d.img),s=e.r*2.7,al=e.alpha===undefined?1:Math.max(0,Math.min(1,e.alpha));

  const g=c.createRadialGradient(e.x,e.y,4,e.x,e.y,e.r*1.6);g.addColorStop(0,d.col+"55");g.addColorStop(1,d.col+"00");c.fillStyle=g;c.fillRect(e.x-e.r*1.6,e.y-e.r*1.6,e.r*3.2,e.r*3.2);
  if(e.mini==="charger"&&e.mode==="dash"){c.globalAlpha=al*.35;if(im)blit(c,im,e.x,e.y-30,s*.95);c.globalAlpha=al;}

  if(im)blit(c,im,e.x,e.y,s*Math.min(1,im.naturalWidth/im.naturalHeight*1.15),e.flash>0);else drawEnemy(c,{x:e.x,y:e.y,r:e.r*.9,type:"elite",flash:e.flash},B.t);c.restore();

  if(e.mini==="shield"){const on=!e.vent;c.strokeStyle=on?`rgba(56,225,255,${.55+(e.rip>0?.4:0)})`:`rgba(56,225,255,${.12+.1*Math.random()})`;c.lineWidth=on?(e.rip>0?6:4):2;c.beginPath();c.arc(e.x,e.y,e.r*1.4,Math.PI*.12,Math.PI*.88);c.stroke();
    if(e.vent&&Math.random()<.5)B.fx.push({x:e.x+rnd(-e.r,e.r),y:e.y+rnd(-e.r*.5,e.r*.5),vx:rnd(-40,40),vy:rnd(-60,-20),life:.3,max:.3,col:"#9ff3ff",r:3});}
  c.globalCompositeOperation="source-over";c.restore();
  if(al<.3)return;
  const w=Math.max(56,e.r*2.1),y=e.y-e.r-12;c.fillStyle="#0a0e2acc";c.fillRect(e.x-w/2-1,y-1,w+2,7);c.fillStyle=d.col;c.fillRect(e.x-w/2,y,w*Math.max(0,e.hp/e.max),5);
  if(!(e.gen>0)&&!(e.side>0)){c.font="800 9px 'Exo 2',sans-serif";c.textAlign="center";c.lineWidth=3;c.strokeStyle="#0a0e2a";const lb=d.name;c.strokeText(lb,e.x,y-6);c.fillStyle="#fff";c.fillText(lb,e.x,y-6);}}

/* --- shooting / impact / explosion FX --- */
const KCOL={kestrel:"#7befff",viper:"#9dffcf",halo:"#d6b3ff",seraph:"#ffe08a",raptor:"#ffd28a",tempest:"#bfe6ff",nebula:"#ffb0d8",oblivion:"#c79bff",drone:"#b5e8ff",wing:"#8dffbf",beam:"#bff6ff",rs:"#ffb070",phantom:"#e2c4ff"};
function spark(b){if(S.set.quality==="low")return;const a=Math.atan2(-b.vy,-b.vx),col=KCOL[b.kind]||"#ffffff";
  for(let i=0;i<3;i++){const aa=a+rnd(-.7,.7),v=rnd(90,220);B.fx.push({x:b.x,y:b.y,vx:Math.cos(aa)*v,vy:Math.sin(aa)*v,life:rnd(.12,.25),max:.25,col,r:rnd(1.5,3)});}}
function blast(x,y,col,sz){B.fx.push({fire:1,x,y,vx:0,vy:0,R:34*sz,life:.38,max:.38});B.fx.push({nova:1,x,y,R:70*sz,life:.35,max:.35,col:"255,180,90"});
  if(S.set.quality!=="low")for(let i=0;i<5;i++){const a=rnd(0,7),v=rnd(60,180)*sz;B.fx.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rnd(.4,.7),max:.7,col:"#7a84b8",r:rnd(3,5)*sz});}
  boom(x,y,col,8,sz);B.shake=Math.max(B.shake,6*sz);}
function deathSequence(x,y,col,sz){for(let i=0;i<Math.round(5+sz*2);i++)B.chain.push({t:i*.16,x:x+rnd(-36,36)*sz,y:y+rnd(-28,28)*sz,col,sz:sz*rnd(.5,.9)});
  B.chain.push({t:Math.round(5+sz*2)*.16,x,y,col,sz:sz*1.5,big:1});}
function fxUpdate(dt){if(B.mf>0)B.mf-=dt;if(B.hsCd>0)B.hsCd-=dt;if(B.flashW>0)B.flashW-=dt;
  for(const k of B.chain){k.t-=dt;if(k.t<=0&&!k.done){k.done=1;blast(k.x,k.y,k.col,k.sz);if(k.big){B.flashW=.35;B.shake=Math.max(B.shake,18);vib(160);}sfx("boom");}}
  B.chain=B.chain.filter(k=>!k.done);
  if(B.boss)dnFlush(B.boss,dt);
  for(const n of B.dn){n.life-=dt;n.y-=46*dt;}B.dn=B.dn.filter(n=>n.life>0);}
function dnFlush(o,dt){o.dnT=(o.dnT||0)-dt;if(o.dnT<=0&&o.dnAcc>0){if(S.set.quality!=="low"&&B.dn.length<40)B.dn.push({x:o.x+rnd(-o.r*.5,o.r*.5),y:o.y-o.r*.2,v:Math.max(1,Math.round(o.dnAcc*10)),crit:o.dnCrit,life:.8});o.dnAcc=0;o.dnCrit=0;o.dnT=.14;}}
function drawDmgNums(c){if(!B.dn.length)return;c.textAlign="center";c.textBaseline="middle";c.lineWidth=4;c.strokeStyle="#0a0e2a";
  for(const n of B.dn){const k=n.life/.8,pop=n.crit?1+Math.max(0,(k-.75))*4:1;c.globalAlpha=Math.min(1,k*2);c.font=`900 ${Math.round((n.crit?19:13)*pop)}px 'Exo 2',sans-serif`;
    c.strokeText(fmt(n.v),n.x,n.y);c.fillStyle=n.crit?"#ffc83d":"#ffffff";c.fillText(fmt(n.v),n.x,n.y);}c.globalAlpha=1;}
function drawFire(c,f){const k=1-f.life/f.max,r=f.R*(.5+k*.8),al=f.life/f.max;c.save();c.globalCompositeOperation="lighter";
  const g=c.createRadialGradient(f.x,f.y,1,f.x,f.y,r);g.addColorStop(0,`rgba(255,255,240,${al})`);g.addColorStop(.3,`rgba(255,200,90,${al*.9})`);g.addColorStop(.65,`rgba(255,90,40,${al*.5})`);g.addColorStop(1,"rgba(255,60,30,0)");
  c.fillStyle=g;c.beginPath();c.arc(f.x,f.y,r,0,7);c.fill();c.restore();}
function muzzle(c,x,y,col){const r=12+Math.random()*5;c.save();c.globalCompositeOperation="lighter";const g=c.createRadialGradient(x,y,1,x,y,r);g.addColorStop(0,"#ffffff");g.addColorStop(.4,col+"cc");g.addColorStop(1,col+"00");
  c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,7);c.fill();c.restore();}
function bossTelegraph(c,b){if(!(b.fire>0&&b.fire<.45)||B.freeze>0)return;const k=1-b.fire/.45,x=b.x,y=b.y+b.r*.45,r=12+k*30;c.save();c.globalCompositeOperation="lighter";
  const g=c.createRadialGradient(x,y,1,x,y,r);g.addColorStop(0,`rgba(255,255,255,${k})`);g.addColorStop(.5,(b.col||"#ff5164")+"aa");g.addColorStop(1,(b.col||"#ff5164")+"00");c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,7);c.fill();c.restore();}

/* --- special enemy bullets --- */
function ebSpecial(b,dt,add){const p=B.p;
  if(b.t==="home"){b.age+=dt;
    // stop seeking once the player is behind the orb (it flew past) or after 5s
    if(b.turn&&(b.y>p.y-6||b.age>5||!p.alive))b.turn=0;
    if(b.turn){const want=Math.atan2(p.y-b.y,p.x-b.x),cur=Math.atan2(b.vy,b.vx);let da=want-cur;while(da>Math.PI)da-=Math.PI*2;while(da<-Math.PI)da+=Math.PI*2;
      const na=cur+Math.max(-b.turn*dt,Math.min(b.turn*dt,da));b.vx=Math.cos(na)*b.sp;b.vy=Math.sin(na)*b.sp;}
    b.tr=b.tr||[];b.tr.push(b.x,b.y);if(b.tr.length>16)b.tr.splice(0,2);}
  else if(b.t==="shell"){b.fuse-=dt;if(b.fuse<=0){b.dead=true;const n=b.ring,v=150+B.mul*12;
      for(let i=0;i<n;i++){const a=i/n*Math.PI*2+rnd(0,.2);add.push({x:b.x,y:b.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:4});}
      B.fx.push({nova:1,x:b.x,y:b.y,R:46,life:.3,max:.3,col:"255,120,60"});sfx("hit");}}
  else if(b.t==="mine"){b.vy*=Math.pow(.55,dt);b.fuse-=dt;if(b.fuse<=0){b.dead=true;const n=b.ring,v=140+B.mul*10;
      for(let i=0;i<n;i++){const a=i/n*Math.PI*2;add.push({x:b.x,y:b.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:4});}
      B.fx.push({nova:1,x:b.x,y:b.y,R:64,life:.35,max:.35,col:"255,157,28"});sfx("hit");}}
  else if(b.t==="brake"){if(b.brk>0){b.brk-=dt;if(b.brk<=0){b.bk=.18;b.v0=Math.hypot(b.vx,b.vy);}}
    else if(b.bk>0){b.bk-=dt;const k=Math.max(b.slow,b.bk/.18),v=Math.hypot(b.vx,b.vy)||1,nv=b.v0*Math.max(b.slow,k);b.vx*=nv/v;b.vy*=nv/v;if(b.bk<=0)b.t="braked";}}}
function drawEnemyBullets(c){const base=bulletSpr("enemy");
  for(const b of B.eb){
    if(b.t==="home"||b.homeDone){const al=b.turn?1:.7;
      if(b.tr&&b.tr.length>4){c.save();c.globalCompositeOperation="lighter";c.lineCap="round";for(let k=2;k<b.tr.length;k+=2){c.strokeStyle=`rgba(255,79,163,${k/b.tr.length*.45*al})`;c.lineWidth=k/b.tr.length*8;c.beginPath();c.moveTo(b.tr[k-2],b.tr[k-1]);c.lineTo(b.tr[k],b.tr[k+1]);c.stroke();}c.restore();}
      const sp=bulletSpr("ehome"),s=34+Math.sin(B.t*10+b.x)*3;c.globalAlpha=al;c.drawImage(sp,b.x-s/2,b.y-s/2,s,s);c.globalAlpha=1;
      if(b.turn){c.strokeStyle="rgba(255,180,220,.7)";c.lineWidth=1.5;c.beginPath();c.arc(b.x,b.y,11+Math.sin(B.t*8)*2,0,7);c.stroke();}
      continue;}
    if(b.t==="mine"){const k=1-b.fuse/b.fuse0,bl=Math.floor(B.t*(4+k*18))%2,s=26;
      if(b.fuse<1){c.strokeStyle=`rgba(255,81,100,${.25+.35*(1-b.fuse)})`;c.lineWidth=2;c.setLineDash([5,5]);c.beginPath();c.arc(b.x,b.y,58,0,7);c.stroke();c.setLineDash([]);}
      c.drawImage(bulletSpr("eshell"),b.x-s/2,b.y-s/2,s,s);c.fillStyle=bl?"#ff5164":"#ffd0a0";c.beginPath();c.arc(b.x,b.y,4,0,7);c.fill();continue;}
    if(b.t==="rail"){c.save();c.globalCompositeOperation="lighter";c.lineCap="round";for(const [lw,col] of [[12,"rgba(255,81,100,.35)"],[5,"rgba(255,160,170,.8)"],[2,"#fff"]]){c.strokeStyle=col;c.lineWidth=lw;c.beginPath();c.moveTo(b.x-b.vx*.05,b.y-b.vy*.05);c.lineTo(b.x,b.y);c.stroke();}c.restore();continue;}
    if(b.t==="shell"){const k=1-b.fuse/b.fuse0,blink=k>.6&&Math.floor(B.t*(8+k*20))%2,s=36;c.drawImage(bulletSpr("eshell"),b.x-s/2,b.y-s/2,s,s);
      c.save();c.globalCompositeOperation="lighter";const g=c.createRadialGradient(b.x,b.y,1,b.x,b.y,10+k*8);g.addColorStop(0,blink?"#ffffff":"#ffe0a0");g.addColorStop(1,"#ff6a3a00");c.fillStyle=g;c.beginPath();c.arc(b.x,b.y,10+k*8,0,7);c.fill();c.restore();continue;}
    if(b.t==="brake"||b.t==="braked"){const v=Math.hypot(b.vx,b.vy),a=Math.atan2(b.vy,b.vx)+Math.PI/2,len=Math.max(14,Math.min(46,v/10));
      c.save();c.translate(b.x,b.y);if(b.t==="braked"){c.strokeStyle=`rgba(159,243,255,${.35+.25*Math.sin(B.t*12+b.x)})`;c.lineWidth=2;c.beginPath();c.arc(0,0,11,0,7);c.stroke();}c.rotate(a);const bw=b.t==="braked"?18:14;c.drawImage(bulletSpr("ebrake"),-bw/2,-Math.max(len,bw+4)/2,bw,Math.max(len,bw+4));c.restore();continue;}
    const s=(b.r+2)*3.4;c.drawImage(base,b.x-s/2,b.y-s/2,s,s);}}

/* --- boss patterns --- */
function bossFire(b){const bs=170+40*Math.min(2,B.mul-1);b.pi=(b.pi+1)%b.pats.length;b.pat=b.pats[b.pi];
  // 5 · seeker orbs: slow, steer toward the player until they fly past, then keep going straight
  if(b.pat===5){const n=b.phase?4:3;for(let i=0;i<n;i++){const s=(i-(n-1)/2);B.eb.push({x:b.x+s*b.r*.6,y:b.y+b.r*.45,vx:s*60,vy:90,r:7,t:"home",sp:125+B.mul*10,turn:1.6,age:0});}b.fire=b.phase?1.3:1.8;return;}
  // 6 · splitter shells: fly half-way to the player, then burst into a ring
  if(b.pat===6){const n=b.phase?3:2;for(let i=0;i<n;i++){const a=Math.atan2(B.p.y-b.y,B.p.x-b.x)+(i-(n-1)/2)*.35,v=bs*1.05,d=Math.hypot(B.p.x-b.x,B.p.y-b.y);
      B.eb.push({x:b.x,y:b.y+b.r*.5,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:10,t:"shell",fuse:Math.max(.35,d*.5/v),fuse0:Math.max(.35,d*.5/v),ring:b.phase?16:12});}b.fire=b.phase?1.4:1.9;return;}
  // 7 · brake curtain: a fast fan that suddenly slams to a crawl
  if(b.pat===7){const n=b.phase?13:9,a0=Math.atan2(B.p.y-b.y,B.p.x-b.x);for(let i=0;i<n;i++){const a=a0+(i-(n-1)/2)*.13,v=bs*2.4;
      B.eb.push({x:b.x,y:b.y+b.r*.4,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:5,t:"brake",brk:.32+Math.abs(i-(n-1)/2)*.03,slow:.22});}b.fire=b.phase?1.2:1.6;return;}
  if(b.pat===3){const arms=b.phase?5:4;for(let k=0;k<3;k++)for(let i=0;i<arms;i++){const a=i/arms*Math.PI*2+b.t*1.7+k*.22;B.eb.push({x:b.x,y:b.y+10,vx:Math.cos(a)*bs*(.8+k*.15),vy:Math.sin(a)*bs*(.8+k*.15),r:5});}}
  else if(b.pat===4){const n=b.phase?13:9;for(let i=0;i<n;i++){const a=Math.PI/2+(i-(n-1)/2)*.17;B.eb.push({x:b.x,y:b.y+b.r*.6,vx:Math.cos(a)*bs*.8,vy:Math.sin(a)*bs*.8,r:7});}}
  else if(b.pat===0){const n=b.phase?18:12;for(let i=0;i<n;i++){const a=i/n*Math.PI*2+b.t;B.eb.push({x:b.x,y:b.y+20,vx:Math.cos(a)*bs,vy:Math.sin(a)*bs,r:6});}}
  else if(b.pat===1){const a0=Math.atan2(B.p.y-b.y,B.p.x-b.x);for(let i=-2;i<=2;i++){const a=a0+i*.16;B.eb.push({x:b.x,y:b.y+30,vx:Math.cos(a)*bs*1.4,vy:Math.sin(a)*bs*1.4,r:5});}}
  else{for(let k=0;k<(b.phase?3:2);k++)[-.8,.8].forEach(s=>B.eb.push({x:b.x+s*b.r,y:b.y+b.r*.35,vx:s*30,vy:bs*1.2+k*40,r:5}));}
  b.fire=b.phase?1.0:1.5;}

/* --- update --- */
function update(dt){const p=B.p;B.t+=dt;
  if(B.bombCd>0)B.bombCd-=dt;if(B.shieldCd>0)B.shieldCd-=dt;
  $("#skBomb .cd").style.setProperty("--p",Math.max(0,B.bombCd/skVal("bomb").cd*100)+"%");$("#skShield .cd").style.setProperty("--p",Math.max(0,B.shieldCd/skVal("shield").cd*100)+"%");
  if(B.p.magnetT>0)B.p.magnetT-=dt;ultUpdate(dt);fxUpdate(dt);if(B.hurtT>0)B.hurtT-=dt;
  for(const t of B.txt){t.y-=dt*40;t.life-=dt;}B.txt=B.txt.filter(t=>t.life>0);
  if(p.inv>0)p.inv-=dt;if(p.shield>0){p.shield-=dt;if(p.shield<=0&&gb().a4&&p.alive&&p.hp<p.maxHp){p.hp++;floatTxt(p.x,p.y-30,"+1 HP","#52f19a");updHud();}}
  if(p.alive&&!B.over&&!B.fly){p.fireT-=dt;if(p.fireT<=0){fire();p.fireT=1/(B.ship.rate*(1+.15*rs("rapid"))*(1+gb().rate)*(1+pk().rate)*(B.od>0?2:1));}runSkillsUpdate(dt);p.droneT-=dt;if(p.droneT<=0){droneFire();p.droneT=.25;}droneUpdate(dt);}
  // stage won: vacuum all drops into the ship, then fly it straight up, then show results
  if(B.ending&&!B.over&&!B.picking){B.endT2+=dt;B.eb=[];drag=null;p.inv=99;
    for(const d of B.drops){const dx=p.x-d.x,dy=p.y-d.y,dist=Math.hypot(dx,dy)||1,v=420+B.endT2*900;d.x+=dx/dist*v*dt;d.y+=dy/dist*v*dt;}
    if(!B.fly&&(B.endT2>2.2||(B.endT2>1.1&&!B.drops.length))){B.fly=1;B.flyV=60;sfx("up");}
    if(B.fly){B.flyV+=1400*dt;p.y-=B.flyV*dt;p.x+=(W/2-p.x)*Math.min(1,dt*3);if(Math.random()<.6)B.fx.push({x:p.x+rnd(-6,6),y:p.y+28,vx:rnd(-20,20),vy:rnd(160,300),life:.35,max:.35,col:"#5ee7ff",r:rnd(2,4)});
      if(p.y<-120){B.over=true;endBattle(true);}}}
  // event timer
  if(B.cfg.mode==="event"&&!B.over){B.endT-=dt;if(B.endT<=0){B.over=true;setTimeout(()=>endBattle(true),600);}if(Math.floor(B.t*4)%4===0)updHud();}
  // waves
  if(!B.boss&&!B.over){const alive=B.en.filter(e=>!e.dead).length;
    if(alive===0)B.vac=true;
    if(alive===0&&B.cfg.mode==="stage"&&B.wave>=B.waves&&!B.ending){B.ending=1;B.endT2=0;B.eb=[];banner("STAGE CLEAR","");sfx("up");}
    if(alive===0||(B.cfg.mode!=="stage"&&alive<4)){B.waveT-=dt;if(B.waveT<=0){
      if(B.wave>=B.waves){if(!B.ending){B.over=true;banner("STAGE CLEAR","");setTimeout(()=>endBattle(true),1400);}}
      else{spawnWave();B.vac=false;B.waveT=1.4;updHud();}}}}
  // bullets
  for(const b of B.pb){if(b.homing){let t=null,dm=1e9;for(const e of B.en)if(!e.dead&&e.age>0){const d=(e.x-b.x)**2+(e.y-b.y)**2;if(d<dm){dm=d;t=e;}}
      if(B.boss&&B.boss.y>40){const d=(B.boss.x-b.x)**2+(B.boss.y-b.y)**2;if(d<dm)t=B.boss;}
      if(t){const a=Math.atan2(t.y-b.y,t.x-b.x),sp=Math.hypot(b.vx,b.vy)+dt*300,cur2=Math.atan2(b.vy,b.vx);let da=a-cur2;while(da>Math.PI)da-=Math.PI*2;while(da<-Math.PI)da+=Math.PI*2;const na=cur2+Math.max(-6*dt,Math.min(6*dt,da));b.vx=Math.cos(na)*sp;b.vy=Math.sin(na)*sp;}}
    b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.rocket){const tr=b.tr||(b.tr=[]);tr.push(b.x,b.y);if(tr.length>24)tr.splice(0,2);}if(b.y<-30||b.x<-30||b.x>W+30)b.dead=true;
    const hw=b.wave||b.r;
    for(const e of B.en){if(e.dead||e.age<0||b.dead||e.ghost)continue;if(Math.abs(e.x-b.x)<e.r+hw&&Math.abs(e.y-b.y)<e.r+b.r+(b.len||0)/2){if(b.lh===e)continue;B._crit=b.crit;hitEnemy(e,b.dmg);B._crit=0;spark(b);if(b.crit&&gb().s4&&Math.random()<.15){B.fx.push({ring:1,x:e.x,y:e.y,r:10,life:.35,max:.35,col:"255,200,61"});for(const o of B.en)if(!o.dead&&o!==e&&Math.hypot(o.x-e.x,o.y-e.y)<90)hitEnemy(o,b.dmg*.6);}if(b.crit)boom(b.x,b.y,"#ffc83d",3,.6);if(b.pierce){b.dmg*=.85;b.lh=e;}else if(b.pl>0){b.pl--;b.lh=e;}else b.dead=true;}}
    const bs=B.boss;if(bs&&!b.dead&&Math.abs(bs.x-b.x)<bs.r*1.1+hw&&Math.abs(bs.y-b.y)<bs.r*.7){B._crit=b.crit;hitBoss(b.dmg);B._crit=0;spark(b);b.dead=true;if(Math.random()<.2)boom(b.x,b.y,"#fff",2,.5);}}
  B.pb=B.pb.filter(b=>!b.dead);
  // enemies
  for(const e of B.en){if(e.dead)continue;if(B.freeze>0){if(e.flash>0)e.flash-=dt;continue;}if(e.mini){miniUpdate(e,dt);if(e.dead)continue;}else if(!moveEnemy(e,dt))continue;if(e.flash>0)e.flash-=dt;
    e.fire-=dt;if(e.fire<=0&&e.y>0&&e.y<H*.65){e.fire=rnd(2,4.5)/Math.sqrt(B.mul);const a=Math.atan2(p.y-e.y,p.x-e.x),sp=150+30*B.mul;
      if(e.type==="tank"||e.type==="elite"){for(let i=-1;i<=1;i++)B.eb.push({x:e.x,y:e.y,vx:Math.cos(a+i*.25)*sp,vy:Math.sin(a+i*.25)*sp,r:5});}
      else if(Math.random()<.6)B.eb.push({x:e.x,y:e.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:4});}
    if(p.alive&&!e.ghost&&Math.hypot(e.x-p.x,e.y-p.y)<e.r+10){if(e.mini)hurtPlayer();else{hitEnemy(e,99);hurtPlayer();}}}
  B.en=B.en.filter(e=>!e.dead);
  // boss
  const bs=B.boss;if(bs){if(bs.flash>0)bs.flash-=dt;if(!(B.freeze>0))bs.t+=dt;if(B.freeze>0){}else if(bs.y<Math.max(H*.24,150+bs.r*1.2))bs.y+=dt*80;else{bs.mt=(bs.mt||0)+(B.freeze>0?0:dt);bs.x=W/2+Math.sin(bs.mt*.7)*Math.max(0,W/2-bs.r*1.3-8);bs.fire-=dt;if(bs.fire<=0)bossFire(bs);}
    if(!bs.phase&&bs.hp<bs.max*.5){bs.phase=1;banner("ENRAGED","",true);}
    $("#bossFill").style.width=Math.max(0,bs.hp/bs.max*100)+"%";}
  // enemy bullets
  const ebAdd=[];for(const b of B.eb){if(b.t&&!(B.freeze>0))ebSpecial(b,dt,ebAdd);if(!(B.freeze>0)){b.x+=b.vx*dt;b.y+=b.vy*dt;}if(b.y>H+20||b.y<-40||b.x<-20||b.x>W+20)b.dead=true;
    if(p.alive&&!b.dead&&Math.hypot(b.x-p.x,b.y-p.y)<b.r+(p.shield>0?30:6)){b.dead=true;if(p.shield>0)boom(b.x,b.y,"#38e1ff",4,.5);else hurtPlayer();}}
  B.eb=B.eb.filter(b=>!b.dead);if(ebAdd.length)B.eb.push(...ebAdd);
  // drops (magnet)
  const mR=p.magnetT>0?W:skVal("magnet").range+60*rs("magnet");

/* hangar showcase: the drone pair firing its real projectile type at a target dummy, on a loop */
function droneShowcase(cv,dd){const c=cv.getContext("2d"),LW=300,LH=170,proj=[],fx=[],ds=[{g:0},{g:0}];let last=0,t=0,tmr=.3,hit=0,heal=0,burst=0,eShot=1;
  const tgt={x:LW/2,y:34},enemy=spr("enemy_grunt");
  const step=now=>{if(!cv.isConnected)return;const dt=last?Math.min(.05,(now-last)/1000):0;last=now;t+=dt;tmr-=dt;
    c.setTransform(cv.width/LW,0,0,cv.height/LH,0,0);c.clearRect(0,0,LW,LH);
    ds.forEach((d,i)=>{d.x=LW/2+(i?1:-1)*62+Math.sin(t*1.2+i)*8;d.y=120+Math.sin(t*2+i*2)*5;if(d.g>0)d.g-=dt;});
    // target dummy
    if(hit>0)hit-=dt;tgt.x=LW/2+Math.sin(t*.9)*40;
    if(enemy){c.save();if(hit>0)c.filter="brightness(2.4)";blit(c,enemy,tgt.x,tgt.y,34);c.restore();}
    // firing per kind
    if(tmr<=0){tmr=Math.max(.35,DKIND[dd.kind][1]);
      ds.forEach((d,i)=>{const s=i?1:-1;d.f=.09;
        const P=(o)=>proj.push(Object.assign({x:d.x,y:d.y-12,life:1.6},o));
        if(dd.kind==="shot"||dd.kind==="guardian")P({vx:0,vy:-360,k:"drone"});
        else if(dd.kind==="laser")P({vx:0,vy:-560,k:"beam"});
        else if(dd.kind==="missile")P({vx:s*40,vy:-160,k:"rocket",hom:1});
        else if(dd.kind==="flak")for(let k=-2;k<=2;k++)P({vx:Math.sin(k*.16)*330,vy:-Math.cos(k*.16)*330,k:"raptor"});
        else if(dd.kind==="medic")P({vx:0,vy:-380,k:"wing"});
        else if(dd.kind==="phantom")P({vx:s*30,vy:-200,k:"phantom",hom:1,tr:[]});
        else if(dd.kind==="solaris")for(let k=-1;k<=1;k++)P({vx:Math.sin(k*.14)*400,vy:-Math.cos(k*.14)*400,k:"seraph"});
        else if(dd.kind==="tesla"){fx.push({bolt:boltPath([[d.x,d.y-8],[tgt.x,tgt.y]]),nodes:[[tgt.x,tgt.y]],life:.22,max:.22});hit=.1;}});
      if(dd.kind==="guardian"){eShot-=1;if(eShot<=0){eShot=2;ds.forEach(d=>proj.push({x:tgt.x,y:tgt.y+14,vx:(d.x-tgt.x)*.9,vy:(d.y-tgt.y)*.9,life:2,k:"enemy",foe:1,to:d}));}}}
    if(dd.kind==="medic"){heal+=dt;if(heal>2.2){heal=0;burst=.8;for(let k=0;k<6;k++)fx.push({plus:1,x:LW/2+rnd(-90,90),y:130+rnd(-10,10),life:1.2,max:1.2});}}
    if(dd.kind==="solaris"){heal+=dt;if(heal>2.6){heal=0;ds.forEach(d=>fx.push({nova:1,x:d.x,y:d.y,R:52,life:.45,max:.45,col:"255,200,61"}));}}
    if(burst>0)burst-=dt;
    // projectiles
    c.globalCompositeOperation="lighter";
    for(const q of proj){q.life-=dt;
      if(q.hom){const a=Math.atan2(tgt.y-q.y,tgt.x-q.x),sp=Math.hypot(q.vx,q.vy)+dt*200,ca=Math.atan2(q.vy,q.vx);let da=a-ca;while(da>Math.PI)da-=Math.PI*2;while(da<-Math.PI)da+=Math.PI*2;const na=ca+Math.max(-5*dt,Math.min(5*dt,da));q.vx=Math.cos(na)*sp;q.vy=Math.sin(na)*sp;}
      q.x+=q.vx*dt;q.y+=q.vy*dt;if(q.tr){q.tr.push(q.x,q.y);if(q.tr.length>16)q.tr.splice(0,2);}
      if(q.foe){if(Math.hypot(q.x-q.to.x,q.y-q.to.y)<26){q.life=0;q.to.g=.3;fx.push({x:q.x,y:q.y,vx:0,vy:0,life:.25,max:.25,col:"#9ff3ff",r:10});}}
      else if(Math.hypot(q.x-tgt.x,q.y-tgt.y)<16){q.life=0;hit=.08;fx.push({x:tgt.x+rnd(-6,6),y:tgt.y+8,vx:0,vy:0,life:.2,max:.2,col:"#ffffff",r:6});}
      if(q.y<-20)q.life=0;
      const a=Math.atan2(q.vy,q.vx)+Math.PI/2;
      if(q.tr&&q.tr.length>4){c.strokeStyle="rgba(179,107,255,.35)";c.lineWidth=4;c.lineCap="round";c.beginPath();for(let k=0;k<q.tr.length;k+=2)k?c.lineTo(q.tr[k],q.tr[k+1]):c.moveTo(q.tr[k],q.tr[k+1]);c.stroke();}
      if(q.k==="rocket"){c.save();c.translate(q.x,q.y);c.rotate(a);c.globalCompositeOperation="source-over";c.drawImage(bulletSpr("missile"),-5,-11,10,22);c.restore();continue;}
      const sp=bulletSpr(q.k);if(!sp)continue;const w=q.k==="enemy"?16:(sp.dw||16)*.75,h=q.k==="enemy"?16:(sp.dh||16)*.75;
      c.save();c.translate(q.x,q.y);if(q.hom)c.rotate(a);c.drawImage(sp,-w/2,-h/2,w,h);c.restore();}
    for(let k=proj.length-1;k>=0;k--)if(proj[k].life<=0)proj.splice(k,1);
    for(const f of fx){f.life-=dt;if(f.bolt){drawBolt(c,f);continue;}if(f.nova){drawNova(c,f);continue;}
      if(f.plus){f.y-=30*dt;c.globalAlpha=f.life/f.max;c.fillStyle="#52f19a";c.font="900 16px 'Exo 2',sans-serif";c.textAlign="center";c.fillText("+",f.x,f.y);c.globalAlpha=1;continue;}
      const al=f.life/f.max,gr=c.createRadialGradient(f.x,f.y,1,f.x,f.y,f.r);gr.addColorStop(0,"#fff");gr.addColorStop(1,(f.col.length===7?f.col:"#ffffff")+"00");c.globalAlpha=al;c.fillStyle=gr;c.beginPath();c.arc(f.x,f.y,f.r,0,7);c.fill();c.globalAlpha=1;}
    for(let k=fx.length-1;k>=0;k--)if(fx[k].life<=0)fx.splice(k,1);
    c.globalCompositeOperation="source-over";
    ds.forEach((d,i)=>{d.f=d.f||0;drawDroneBody(c,dd,d.x,d.y,t+i*1.3,{size:15,vx:Math.cos(t*1.2+i)*80,f:tmr>DKIND[dd.kind][1]-.09?.09:0,g:d.g,pulse:burst});});
    requestAnimationFrame(step);};
  requestAnimationFrame(step);}

/* ---- skill VFX ---- */
function drawMissile(c,b,a){const tr=b.tr;
  if(tr&&tr.length>4){c.lineCap="round";const n=tr.length/2;
    for(let i=1;i<n;i++){const k=i/n;c.strokeStyle=`rgba(${k>.7?"255,180,80":"200,210,235"},${k*.45})`;c.lineWidth=2+k*5;c.beginPath();c.moveTo(tr[i*2-2],tr[i*2-1]);c.lineTo(tr[i*2],tr[i*2+1]);c.stroke();}}
  const fl=bulletSpr("flame"),ms=bulletSpr("missile");c.save();c.translate(b.x,b.y);c.rotate(a);
  c.drawImage(fl,-6,10,12,18+Math.random()*10);
  const g=c.createRadialGradient(0,0,1,0,0,18);g.addColorStop(0,"#ff516455");g.addColorStop(1,"#ff516400");c.fillStyle=g;c.fillRect(-18,-18,36,36);
  c.globalCompositeOperation="source-over";c.drawImage(ms,-7,-16,14,32);c.globalCompositeOperation="lighter";c.restore();}
function drawOrbs(c,p,no){const R=58+no*3,sp=bulletSpr("plasma");
  c.save();c.globalCompositeOperation="lighter";
  c.strokeStyle="rgba(179,107,255,.18)";c.lineWidth=2;c.setLineDash([4,8]);c.beginPath();c.arc(p.x,p.y,R,0,7);c.stroke();c.setLineDash([]);
  for(let i=0;i<no;i++){const a=B.t*3.2+i/no*Math.PI*2;
    for(let k=6;k>=1;k--){const aa=a-k*.09,x=p.x+Math.cos(aa)*R,y=p.y+Math.sin(aa)*R,s=26*(1-k/9);c.globalAlpha=.35*(1-k/7);c.drawImage(sp,x-s/2,y-s/2,s,s);}
    c.globalAlpha=1;const x=p.x+Math.cos(a)*R,y=p.y+Math.sin(a)*R,pul=34+Math.sin(B.t*12+i)*3;c.drawImage(sp,x-pul/2,y-pul/2,pul,pul);}
  c.restore();}
function boltPath(pts){const out=[];
  for(let i=0;i<pts.length;i++){const [x,y]=pts[i];if(!i){out.push([x,y]);continue;}const [px,py]=pts[i-1],d=Math.hypot(x-px,y-py),n=Math.max(3,Math.round(d/18));
    for(let s=1;s<=n;s++){const k=s/n,j=s<n?18*Math.sin(k*Math.PI):0;out.push([px+(x-px)*k+rnd(-j,j)*.6,py+(y-py)*k+rnd(-j,j)*.6]);}}
  // a few short forks
  const forks=[];for(let i=2;i<out.length-1;i+=3){const [x,y]=out[i],a=rnd(0,7),l=rnd(10,24);forks.push([x,y,x+Math.cos(a)*l,y+Math.sin(a)*l]);}
  out.forks=forks;return out;}
function drawBolt(c,f){const al=f.life/f.max,P=f.bolt;c.save();c.globalCompositeOperation="lighter";c.lineCap="round";c.lineJoin="round";
  const jit=()=>P.map(([x,y],i)=>i&&i<P.length-1?[x+rnd(-2,2),y+rnd(-2,2)]:[x,y]);const Q=jit();
  for(const [lw,col] of [[14,`rgba(70,140,255,${.22*al})`],[6,`rgba(120,200,255,${.6*al})`],[2.4,`rgba(255,255,255,${al})`]]){
    c.strokeStyle=col;c.lineWidth=lw;c.beginPath();Q.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.stroke();
    if(lw<10){c.lineWidth=lw*.6;for(const [x1,y1,x2,y2] of P.forks){c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();}}}
  const sp=bulletSpr("spark");for(const [x,y] of f.nodes){const s=40*(.6+al*.6);c.globalAlpha=al;c.drawImage(sp,x-s/2,y-s/2,s,s);}
  c.restore();}
function drawNova(c,f){const k=1-f.life/f.max,e=1-Math.pow(1-k,3),r=Math.max(4,f.R*e),al=f.life/f.max;c.save();c.globalCompositeOperation="lighter";
  const g=c.createRadialGradient(f.x,f.y,r*.55,f.x,f.y,r);g.addColorStop(0,`rgba(${f.col},0)`);g.addColorStop(.8,`rgba(${f.col},${.35*al})`);g.addColorStop(1,`rgba(${f.col},0)`);
  c.fillStyle=g;c.beginPath();c.arc(f.x,f.y,r,0,7);c.fill();
  c.strokeStyle=`rgba(255,255,255,${.85*al})`;c.lineWidth=3;c.beginPath();c.arc(f.x,f.y,r*.96,0,7);c.stroke();
  c.strokeStyle=`rgba(${f.col},${.6*al})`;c.lineWidth=6;c.beginPath();c.arc(f.x,f.y,r*.8,0,7);c.stroke();
  if(k<.25){const fl=c.createRadialGradient(f.x,f.y,1,f.x,f.y,60);fl.addColorStop(0,`rgba(255,255,255,${.8*(1-k*4)})`);fl.addColorStop(1,"rgba(255,255,255,0)");c.fillStyle=fl;c.beginPath();c.arc(f.x,f.y,60,0,7);c.fill();}
  c.restore();}
function floatTxt(x,y,s,col){B.txt.push({x,y,s,col,life:1});}

/* --- pause / revive / results --- */
function pauseGame(){if(!B||B.over||B.picking)return;B.paused=true;const c=B.cfg;
  const sub=c.mode==="stage"?`Stage ${lvName(c.idx)} · Wave ${Math.max(1,Math.min(B.wave,B.waves))}/${B.waves}`:c.mode==="endless"?`Endless · Wave ${B.wave}`:c.mode==="event"?"Crimson Swarm":"Boss Rush";
  const qs=[["music","music","Music"],["sfx","sfx","Sound"],["vib","vibration","Vibrate"],["lefty","set_lefty","Left-hand"]];
  const sk=Object.keys(B.rs);
  const p=pop("Paused",`<div class="vr">
    <div class="vrsub">${sub}</div>
    <div class="vrstats">
     <div>${vIcon("sk_crit","",false)}<b class="num">${fmt(B.score)}</b><small>Score</small></div>
     <div><i class="ic-coin pcoin"></i><b class="num">${fmt(B.coins)}</b><small>Coins</small></div>
     <div>${vIcon("rank","",false)}<b class="num">Lv ${B.lv}</b><small>Pilot level</small></div>
    </div>
    ${sk.length?`<div class="vrlbl">Skills built</div><div class="pskills">${sk.map(id=>{const s=RUNSK.find(x=>x.id===id);return `<div class="psk">${skIcon(s)}<span><b>${skName(s)}</b><i class="lvpips" style="--sc:${s.col}">${Array.from({length:s.max},(_,k)=>`<i class="${k<B.rs[id]?"on":""}"></i>`).join("")}</i></span></div>`;}).join("")}</div>`:""}
    <div class="vrlbl">Quick settings</div>
    <div class="pqs">${qs.map(([k,ic,lb])=>`<button class="pq ${S.set[k]?"on":""}" data-pt="${k}" aria-pressed="${!!S.set[k]}">${vIcon(ic,"",false)}<small>${lb}</small></button>`).join("")}</div>
    <button class="btn green pres" id="pR">▶ RESUME</button>
    <div class="pacts"><button class="btn blue" id="pRe">Restart <small>⚡${ENERGY_COST}</small></button><button class="btn ghost pquit" id="pQ">Quit</button></div>
   </div>`,"vrpop ppop",resume);
  p.querySelectorAll("[data-pt]").forEach(b=>b.onclick=()=>{const k=b.dataset.pt;S.set[k]=!S.set[k];save();applySettings();b.classList.toggle("on",S.set[k]);b.setAttribute("aria-pressed",S.set[k]);sfx("tap");});
  p.querySelector("#pR").onclick=resume;
  p.querySelector("#pRe").onclick=()=>{if(S.energy<ENERGY_COST)return POPS.energy();S.energy-=ENERGY_COST;save();closePop();startBattle(B.cfg);};
  p.querySelector("#pQ").onclick=()=>{const q=pop("Quit stage?",`<p style="text-align:center;font-weight:600">You lose coins collected in this run and the energy spent.</p><div class="acts"><button class="btn ghost" id="n">Stay</button><button class="btn pink" id="y">Quit</button></div>`,"lose",()=>pauseGame());
    q.querySelector("#n").onclick=()=>pauseGame();q.querySelector("#y").onclick=()=>{closePop();B=null;go("home");};};}
function resume(){closePop();if(B){B.paused=false;last=performance.now();}}
let revT;function revivePop(){let n=5;const b0=B;B.paused=true;
  const p=pop("Revive?",`<div class="disp" style="text-align:center;font-size:64px;color:var(--gold)" id="rvN">5</div><p style="text-align:center;font-weight:700;margin:0">Continue with full HP and keep your coins.</p>
   <div class="list" style="margin-top:12px"><button class="btn pink" id="rvG">REVIVE · ${priceTxt({gem:50})}</button><button class="btn blue" id="rvA">▶ Watch ad to revive</button><button class="btn ghost sm" id="rvN2">No thanks</button></div>`,"lose",()=>{clearInterval(revT);closePop();endBattle(false);});
  const rev=()=>{clearInterval(revT);closePop();B.revived=true;B.over=false;B.paused=false;B.p.alive=true;B.p.hp=B.p.maxHp;B.p.inv=2.5;B.eb=[];B.fx.push({ring:1,x:B.p.x,y:B.p.y,r:10,life:.6,max:.6});last=performance.now();updHud();};
  revT=setInterval(()=>{const el=$("#rvN");if(!el||!B||B!==b0){clearInterval(revT);return;}n--;el.textContent=n;if(n<=0){clearInterval(revT);closePop();endBattle(false);}},1000);
  p.querySelector("#rvG").onclick=()=>{if(spend({gem:50}))rev();};
  p.querySelector("#rvA").onclick=()=>{clearInterval(revT);fakeAd(rev);};
  p.querySelector("#rvN2").onclick=()=>{clearInterval(revT);closePop();endBattle(false);};}
function endBattle(win){if(!B)return;const c=B.cfg,b=B;B.paused=true;
  const ratio=b.p.hp/b.p.maxHp,stars=win?(ratio>=1&&!b.revived?3:ratio>=.5?2:1):0;
  let base=0,gems=0,firstClear=false;
  let drop=null,alloy=0;if(c.mode==="stage"&&win){alloy=Math.round((3+Math.floor(Math.random()*6)+Math.floor(c.idx/5)*2)*(1+pk().alloy));S.gear.alloy+=alloy;if(isBoss(c.idx)||Math.random()<.12+pk().drop){const hard=c.diff!=="normal";drop=randGear(isBoss(c.idx)?(hard?1+(Math.random()<.35?1:0):(Math.random()<.4?1:0)):0);}}
  if(c.mode==="stage"&&win){const prev=S.stars[c.diff][c.idx]||0;firstClear=!prev;S.stars[c.diff][c.idx]=Math.max(prev,stars);base=200+c.idx*60;gems=firstClear?5+Math.floor(c.idx/5)*5:0;}
  if(c.mode==="endless"){S.bestEndless=Math.max(S.bestEndless,b.score);base=Math.floor(b.score/50);}
  if(c.mode==="event"){S.eventBest=Math.max(S.eventBest,b.score);base=Math.floor(b.score/40);}
  if(c.mode==="bossrush"&&win){gems=60;base=3000;}
  const total=b.coins+base;S.stats.coinsEarned+=total;qAdd("coin2k",b.coins);S.xp+=win?60+c.idx*10:20;save();
  const isWin=win||c.mode==="endless";
  // result screen: stars → stat strip → one row of equal reward tiles → build → actions
  const sub=c.mode==="stage"?`Stage ${lvName(c.idx)} · ${DIFFS.find(x=>x.id===c.diff).name}`:c.mode==="endless"?`Endless · best ${fmt(S.bestEndless)}`:c.mode==="event"?"Crimson Swarm":"Boss Rush";
  const tiles=[`<div class="vrt"><i class="ic-coin"></i><b class="num" data-count="${total}">0</b><small>Coins</small></div>`];
  if(gems)tiles.push(`<div class="vrt"><i class="ic-gem"></i><b class="num">${gems}</b><small>Gems</small></div>`);
  if(alloy)tiles.push(`<div class="vrt">${sprImg("mat_alloy","vrimg")}<b class="num">${alloy}</b><small>Alloy</small></div>`);
  if(drop)tiles.push(`<div class="vrt gear r${drop.rar}"><span class="vrnew">NEW</span>${sprImg(gImg(drop),"vrimg")}<b style="color:${GRCOL[drop.rar]}">${GRAR[drop.rar]}</b><small>${GSLOTS.find(s=>s.id===drop.slot).name}</small></div>`);
  const p=pop(isWin?(c.mode==="stage"?"Victory!":"Run complete"):"Defeat",`<div class="vr">
   ${c.mode==="stage"&&win?`<div class="bigstars">${[1,2,3].map(k=>`<span class="${k<=stars?"on":""}" style="animation-delay:${k*.25}s">★</span>`).join("")}</div>`:""}
   <div class="vrsub">${sub}</div>
   ${!isWin?`<div class="vrtip">Upgrade your ship or gear, then try again</div>`:""}
   <div class="vrstats">
    <div>${vIcon("sk_crit","",false)}<b class="num">${fmt(b.score)}</b><small>Score</small></div>
    <div>${vIcon("sk_damage","",false)}<b class="num">${fmt(b.kills)}</b><small>Destroyed</small></div>
    <div>${vIcon("rank","",false)}<b class="num">Lv ${b.lv}</b><small>Pilot level</small></div>
   </div>
   <div class="vrlbl">Rewards</div>
   <div class="vrtiles" style="--n:${tiles.length}">${tiles.join("")}</div>
   ${Object.keys(b.rs).length?`<div class="vrlbl">Skills built</div><div class="vrbuild">${skillBarHtml(true)}</div>`:""}
   <div class="vracts">
    ${isWin?`<button class="btn blue vrad" id="x2">▶ Watch ad · <span>×2 coins</span> <i class="ic-coin"></i><b class="num">${fmt(total*2)}</b></button>`:""}
    <button class="btn ghost" id="home2">Home</button>
    ${c.mode==="stage"?(win?`<button class="btn green" id="next">NEXT ▶</button>`:`<button class="btn" id="retry">RETRY</button>`):`<button class="btn" id="retry">AGAIN</button>`}
    ${c.mode==="stage"&&!win?`<button class="btn blue vrup" data-go="hangar">Upgrade</button>`:""}
   </div></div>`,(isWin?"win":"lose")+" vrpop",()=>{finish(1);closePop();go("home");});
  // coin count-up
  {const el=p.querySelector("[data-count]"),to=+el.dataset.count;let t0=null;const iv=setInterval(()=>{if(!el.isConnected){clearInterval(iv);return;}const now=performance.now();if(t0===null)t0=now;const k=Math.min(1,(now-t0)/900);el.textContent=fmt(Math.round(to*(1-Math.pow(1-k,3))));if(k>=1)clearInterval(iv);},30);}
  give({c:total,g:gems});let done=false;const finish=m=>{if(done)return;done=true;if(m>1)give({c:total*(m-1)});B=null;};
  p.querySelector("#x2")&&(p.querySelector("#x2").onclick=()=>fakeAd(()=>{finish(2);toast(`+${fmt(total*2)} coins`);go("home");}));
  p.querySelector("#home2").onclick=()=>{finish(1);closePop();go("home");};
  p.querySelector("#next")&&(p.querySelector("#next").onclick=()=>{finish(1);closePop();go("home");levelPop(Math.min(c.idx+1,WORLDS.length*LV_PER_WORLD-1),c.diff);});
  p.querySelector("#retry")&&(p.querySelector("#retry").onclick=()=>{finish(1);closePop();if(c.mode==="stage")levelPop(c.idx,c.diff);else{go("home");c.mode==="event"?POPS.event():modePop(c.mode);}});
  sfx(isWin?"up":"hit");}

/* ============ ICONS (Codex art replaces the inline SVGs when present) ============ */
function applyIcons(){
  $$("[data-i5]").forEach(el=>{const k="ui5_"+el.dataset.i5;if(SPR_HAS(k))el.innerHTML=sprImg(k,"i5");});
  $$("[data-card-art]").forEach(el=>{const k="card_"+el.dataset.cardArt;if(SPR_HAS(k))el.style.backgroundImage=`url(${SPR_SRC[k]})`;});
  $$("[data-v]").forEach(el=>el.innerHTML=vIcon(el.dataset.v,"",false));

function trNode(n){const lang=S.set.lang;if(n.__vi!==undefined&&n.data===n.__vi&&n.__lang===lang)return;
  if(n.__vi===undefined||n.data!==n.__vi)n.__en=n.data;
  const en=n.__en;n.__lang=lang;if(!/[A-Za-z]/.test(en)){n.__vi=en;return;}
  const out=lang==="VI"?en.replace(VI_RE,m=>VI[m]):en;n.__vi=out;if(n.data!==out)n.data=out;}
function trTree(root){if(root.nodeType===3)return trNode(root);if(root.nodeType!==1||root.tagName==="SCRIPT"||root.tagName==="STYLE")return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while((n=w.nextNode()))trNode(n);}
new MutationObserver(ms=>{for(const m of ms){if(m.type==="characterData")trNode(m.target);else m.addedNodes.forEach(trTree);}})
  .observe($("#stage"),{childList:true,subtree:true,characterData:true});

function applySettings(){const s=S.set;applyVolume();
  if(!s.music){clearInterval(mTimer);mTimer=null;}else if(AC&&!mTimer){const t=mTrack||"menu";mTrack=null;playMusic(t);}
  $("#battle").classList.toggle("lefty",s.lefty);$("#fps").hidden=!s.fps;
  document.documentElement.classList.toggle("vi",s.lang==="VI");document.documentElement.lang=s.lang==="VI"?"vi":"en";trTree($("#stage"));
  if(B)sizeGame();}

/* ============ MAIN LOOP ============ */
let last=performance.now(),fpsN=0,fpsT=0,fpsL=0;
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  const popOpen=!veil.hidden;
  if(!popOpen||cur==="battle")drawBg(dt);
  if(S.set.fps){fpsN++;fpsT+=now-(fpsL||now);fpsL=now;if(fpsT>500){$("#fps").textContent=Math.round(fpsN*1000/fpsT)+" FPS";fpsN=0;fpsT=0;}}
  if(cur==="battle"&&B){if(!B.paused){if(B.hs>0)B.hs-=dt;else if(B.slow>0){B.slow-=dt;update(dt*.3);}else update(dt);}if(B)render();}
  else if(cur==="home"&&!popOpen){showT+=dt;const cv=$("#shipShow"),c=cv.getContext("2d");c.clearRect(0,0,440,440);
    const d=shipDef(S.ship);
    drawShip(c,d,220,200+Math.sin(showT*1.6)*12,110,showT,S.ships[S.ship].star);
    }
  requestAnimationFrame(loop);}
setInterval(()=>{tickEnergy();if(!document.hidden){const O=onlineState();O.sec++;if(O.sec%5===0)save();const el=$("#olT");if(el)el.textContent=mmss(O.sec);if(cur==="home")$("#dOnline").hidden=!onlineReady();}const e=$("#eT");if(e)e.textContent=nrgLeft();
  const ms=Date.UTC(2026,9,30,0,0)-Date.now();if(ms>0)$("#evTimer").textContent=`${Math.floor(ms/864e5)}d ${Math.floor(ms/36e5)%24}h left`;},1000);
window.addEventListener("resize",()=>{sizeBg();if(B)sizeGame();});

/* ============ BOOT ============ */
(function boot(){applyIcons();applySettings();sizeBg();requestAnimationFrame(loop);let p=0;const ld=$("#load");$(".h6id").textContent="ID: "+pid();$("#load .ldver").textContent="v"+APP_VER;
  if(SPR_HAS("logo_main")){$("#ldLogo").src=SPR_SRC.logo_main;$("#ldLogoTxt").hidden=true;}else $("#ldLogo").hidden=true;
  if(SPR_HAS("bg_home"))$("#load .ldbg").style.backgroundImage=`url(${SPR_SRC.bg_home})`;
  const tips=["Calibrating thrusters…","Loading hangar…","Scanning the Orbit Belt…","Ready"];
  const t=setInterval(()=>{p=Math.min(100,p+rnd(5,11));$("#loadFill").style.width=p+"%";$("#loadPct").textContent=Math.floor(p)+"%";$("#loadTip").textContent=tips[Math.min(3,Math.floor(p/30))];
    if(p>=100){clearInterval(t);setTimeout(()=>{go("home");ld.hidden=false;ld.classList.add("out");
      setTimeout(()=>{ld.hidden=true;ld.classList.remove("out");launchPops();},450);},300);}},110);
  // music needs a user gesture: wake the audio on the first touch after the auto-start
  document.addEventListener("pointerdown",()=>{try{audio();if(AC.state==="suspended")AC.resume();}catch(e){}},{once:true});
  refresh();})();
</script>
